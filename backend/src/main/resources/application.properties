# PolyglotMesh Application Configuration

# Server Configuration
server.port=8080
server.address=127.0.0.1

# Application Name
spring.application.name=polyglotmesh

# MongoDB stores executions for the existing history endpoints.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/polyglotmesh?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}

# Execution Engine Configuration
execution.default-timeout-ms=30000
execution.max-timeout-ms=120000
execution.default-max-output-size=1048576
execution.max-output-size=10485760
execution.enable-security-restrictions=true
execution.java-compilation-timeout-ms=60000
execution.java-execution-timeout-ms=30000
execution.java-temp-dir=
execution.allow-host-access=false
execution.allow-host-class-lookup=false
execution.allow-native-access=false
execution.allow-io=false
execution.allow-experimental-options=false

# Logging Configuration
logging.level.com.polyglotmesh=DEBUG
logging.level.org.graalvm=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false